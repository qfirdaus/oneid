server {
    listen 443 ssl http2;
    server_name oneid-staging.example.edu.my;

    root /var/www/oneid-uat/public;
    index index.php;
    client_max_body_size 6m;

    # Tetapkan ssl_certificate dan ssl_certificate_key mengikut host.

    # Kekalkan status HTTP sebenar tetapi gantikan badan respons lalai Nginx.
    # Respons PHP/API tidak dipintas; lihat fastcgi_intercept_errors di bawah.
    error_page 400 401 403 404 405 408 413 414 /errors/404.html;
    error_page 429 /errors/429.html;
    error_page 500 502 503 504 /errors/50x.html;

    location = /errors/404.html { internal; }
    location = /errors/429.html { internal; }
    location = /errors/50x.html { internal; }

    location / {
        if (-f $request_filename.php) {
            rewrite ^(.+?)/?$ $1.php last;
        }
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* ^/(?:assetsM|dist|img|vendors|public_docs|public_img|videos)/.*\.(?:php[0-9]?|phtml|phar|cgi|pl|py|sh)$ {
        return 404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/oneid-web-uat84.sock;
        fastcgi_intercept_errors off;
    }

    location ~ /\. {
        deny all;
    }
}
