# Only fixed labels are logged. Never log raw Location or query parameters.
map $sent_http_location $oneid_redirect_target {
    default other;
    "" none;
    ~^com\.upnmmobile1\.app://oneid/callback(?:\?|$) android_callback;
    ~^https://oneid-uat\.upnm\.edu\.my/mobile-test/callback(?:\?|$) browser_test_callback;
    ~^https://oneid-uat\.upnm\.edu\.my/login(?:\?|$) oneid_login;
    ~^https://oneid-uat\.upnm\.edu\.my/consent(?:\?|$) oneid_consent;
    ~^https://oneid-uat\.upnm\.edu\.my/oauth2/auth(?:\?|$) provider_auth;
}
map $sent_http_location $oneid_redirect_code {
    default 0;
    ~[?&]code= 1;
}
map $sent_http_location $oneid_redirect_error {
    default none;
    ~[?&]error=invalid_request(?:&|$) invalid_request;
    ~[?&]error=access_denied(?:&|$) access_denied;
    ~[?&]error=unauthorized_client(?:&|$) unauthorized_client;
    ~[?&]error=invalid_scope(?:&|$) invalid_scope;
    ~[?&]error=server_error(?:&|$) server_error;
    ~[?&]error=temporarily_unavailable(?:&|$) temporarily_unavailable;
    ~[?&]error= other_error;
}
log_format oneid_redirect_diag escape=json
    '{"time":"$time_iso8601","status":$status,'
    '"target":"$oneid_redirect_target","code_present":$oneid_redirect_code,'
    '"error":"$oneid_redirect_error"}';
